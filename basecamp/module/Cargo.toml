[package]
name = "logos_agents_module"
version = "0.3.2"
edition = "2021"

# Standalone crate: built by logos-module-builder, not part of the repo's workspace.
[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
# The library from this repo, copied here by flake.nix (locally a gitignored symlink).
logos-agents = { path = "vendor/logos-agents", default-features = false }
# The same logos-mcp logos-agents builds on, with the module support it needs.
logos-mcp = { git = "https://github.com/drptbl/logos-mcp", rev = "f29c2d123855b125289bfe5480e12e8955fe2a4e", default-features = false, features = ["module"] }
# Staged by the builder, same rev as the generator.
logos-rust-sdk = { path = "../logos-rust-sdk-src" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tokio-util = "0.7"
