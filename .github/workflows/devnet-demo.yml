# A paid job between two agents on a local LEZ devnet: scripts/demo_escrow_job.py with
# --decline, each tool called once and the follow-through doing the rest. Chat and
# discovery go over the public logos.dev fleet, so this runs nightly and on demand, and
# on PRs that change the demo itself, rather than gating every PR on that network.
name: devnet demo

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}
  pull_request:
    paths:
      - .github/workflows/devnet-demo.yml
      - logos-devnet.toml
      - scripts/demo_escrow_job.py
      - scripts/devnet_wallets.sh
      - scripts/fetch_escrow.sh

permissions:
  contents: read

concurrency:
  group: devnet-demo-${{ github.ref }}
  cancel-in-progress: true

env:
  LOGOSCTL_VERSION: "0.3.2"
  LOGOSCTL_SHA256: 294fbcc6409a8851b7471582bdad2dbfaf681b5d1c67dfffec38ada925dc6762

jobs:
  demo:
    # The devnet runs in Docker, so it needs a Linux runner.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked
      # logosctl ships as an AppImage. Extracted, it runs without FUSE.
      - name: Install logosctl
        run: |
          dir="$RUNNER_TEMP/logosctl"
          mkdir -p "$dir/bin"
          cd "$dir"
          curl -fsSL -o logosctl.tar.gz "https://github.com/logos-co/logos-logoscore-cli/releases/download/$LOGOSCTL_VERSION/logosctl-x86_64-linux.tar.gz"
          echo "$LOGOSCTL_SHA256  logosctl.tar.gz" | sha256sum -c -
          tar xzf logosctl.tar.gz
          ./logosctl-x86_64.AppImage --appimage-extract >/dev/null
          printf '#!/bin/sh\nexec "%s/squashfs-root/AppRun" "$@"\n' "$dir" > bin/logosctl
          chmod +x bin/logosctl
          echo "$dir/bin" >> "$GITHUB_PATH"
      - run: logosctl --version
      - run: scripts/fetch_escrow.sh
      # Starts the devnet from logos-devnet.toml: the escrow and a logosctl session per side.
      - uses: drptbl/logos-devnet@v0.3.4
      - name: Fund a wallet for each side
        run: echo "BUYER=$(scripts/devnet_wallets.sh "$RUNNER_TEMP/wallets")" >> "$GITHUB_ENV"
      - name: Find the logos.dev discovery peers
        run: |
          curl -fsSL https://fleets.logos.co/data.json | python3 -I -c '
          import json, sys
          nodes = json.load(sys.stdin)["logos.dev"]["logos-node-delivery"].values()
          print("BOOTSTRAP=" + ",".join(n["ServiceMeta"]["libp2p_multiaddr"] + "/p2p/" + n["ServiceMeta"]["libp2p_peer_id"]
                                       for n in nodes if n["ServiceMeta"].get("libp2p_peer_id")))' >> "$GITHUB_ENV"
      - name: Run a delivered and a declined job
        run: |
          python3 scripts/demo_escrow_job.py \
            --provider-session "$HOME/.logos-devnet/sessions/agents-provider/logosctl" --provider-wallet "$RUNNER_TEMP/wallets/provider" \
            --buyer-session "$HOME/.logos-devnet/sessions/agents-buyer/logosctl" --buyer-wallet "$RUNNER_TEMP/wallets/buyer" \
            --buyer-from "$BUYER" --bootstrap "$BOOTSTRAP" --decline --poll 3 --timeout 600
      # The demo keeps each server's log in a logos-mcp-demo-* folder under /tmp.
      - name: Keep the logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/demo-logs"
          cp -r /tmp/logos-mcp-demo-* "$RUNNER_TEMP/demo-logs/" 2>/dev/null || true
          logos-devnet logs > "$RUNNER_TEMP/demo-logs/sequencer.log" 2>&1 || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devnet-demo-logs
          path: ${{ runner.temp }}/demo-logs
          if-no-files-found: ignore
